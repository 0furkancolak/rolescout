name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: rolescout
          POSTGRES_USER: rolescout
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rolescout -d rolescout"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://rolescout:ci-only-password@127.0.0.1:5432/rolescout?sslmode=disable
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
      - name: Check for known vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high

  # Builds the Compose stack and checks it end to end through the web proxy.
  e2e:
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: |
          printf 'POSTGRES_PASSWORD=ci-only-password\n' > .env
      - name: Start stack
        # The worker would start crawling the internet for the first
        # account's research profile; CI checks the API without it.
        run: |
          docker compose up -d --build --wait --wait-timeout 300
          docker compose stop worker
      - name: Smoke test
        run: scripts/smoke.sh
      - name: Backup and restore
        run: |
          count() { docker compose exec -T postgres psql -U rolescout -d rolescout -tAc "select count(*) from $1"; }
          before=$(count workspaces)
          scripts/backup.sh backups/ci.dump
          docker compose exec -T postgres psql -U rolescout -d rolescout -c "delete from workspaces; delete from users"
          test "$(count users)" = 0
          scripts/restore.sh backups/ci.dump --yes
          test "$(count workspaces)" = "$before"
          test "$(count users)" = 1
          docker compose up -d --wait --wait-timeout 120
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:4173/api/v1/auth/me)" = 401
      - name: Logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop stack
        if: always()
        run: docker compose down -v
