openapi: 3.1.0
info:
  title: RoleScout API
  version: 0.1.0
  summary: Job discovery and application tracking.
  description: |
    Conventions are described in docs/api/README.md.
    Every /api/v1 operation except register, login and logout requires the
    `rolescout_session` cookie and returns `401 unauthenticated` without a
    valid one. Workspace operations additionally require membership.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
  - url: http://127.0.0.1:8080
    description: Local Docker Compose
security:
  - sessionCookie: []
tags:
  - name: auth
  - name: workspaces
  - name: health
  - name: jobs
  - name: saved-jobs
  - name: applications
  - name: tags
  - name: notes
  - name: research
  - name: companies
  - name: admin

paths:
  /healthz:
    get:
      tags: [health]
      summary: Liveness check
      operationId: getHealth
      security: []
      responses:
        "200":
          description: The process is running.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: ok }
  /readyz:
    get:
      tags: [health]
      summary: Readiness check including PostgreSQL
      operationId: getReadiness
      security: []
      responses:
        "200":
          description: Ready to serve traffic.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: ready }
                  database: { type: string, const: ok }
        "503":
          description: The database is unreachable.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: not_ready }

  /api/v1/auth/register:
    post:
      tags: [auth]
      summary: Create an account and sign in
      description: |
        Always allowed while the installation has no users. Afterwards it requires
        `ALLOW_REGISTRATION=true`. Creates a personal workspace ("Kişisel" or
        "Personal" by locale) and sets the session cookie.
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password, display_name]
              properties:
                email: { type: string, format: email, maxLength: 254 }
                password: { type: string, minLength: 12, maxLength: 128 }
                display_name: { type: string, minLength: 1, maxLength: 100 }
                locale: { type: string, enum: [tr, en], default: tr }
      responses:
        "201":
          description: Registered and signed in.
          headers:
            Set-Cookie: { $ref: "#/components/headers/SessionCookie" }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "403":
          description: "`registration_closed`: sign-ups are disabled."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/InvalidInput" }
  /api/v1/auth/setup:
    get:
      tags: [auth]
      summary: Whether anyone may still create an account
      description: >
        `registration_open` is true until the first account exists (or when
        `ALLOW_REGISTRATION=true`). The sign-in page uses it to show or hide
        "create account".
      operationId: getSetup
      security: []
      responses:
        "200":
          description: The sign-up state.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [registration_open]
                    properties:
                      registration_open: { type: boolean }
  /api/v1/auth/login:
    post:
      tags: [auth]
      summary: Sign in
      description: Starts a new session on every successful login.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        "200":
          description: Signed in.
          headers:
            Set-Cookie: { $ref: "#/components/headers/SessionCookie" }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "401":
          description: "`invalid_credentials`: same response for unknown emails and wrong passwords."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/auth/logout:
    post:
      tags: [auth]
      summary: Sign out
      description: Revokes the current session if any and clears the cookie. Always succeeds.
      operationId: logout
      security: []
      responses:
        "204": { description: Signed out. }
  /api/v1/auth/me:
    get:
      tags: [auth]
      summary: The signed-in user
      operationId: getMe
      responses:
        "200":
          description: The user.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /api/v1/workspaces:
    get:
      tags: [workspaces]
      summary: Workspaces the user belongs to, oldest first
      operationId: listWorkspaces
      responses:
        "200":
          description: Workspaces.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Workspace" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
    post:
      tags: [workspaces]
      summary: Create a workspace owned by the user
      operationId: createWorkspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 100 }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Workspace" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "422": { $ref: "#/components/responses/InvalidInput" }
  /api/v1/workspaces/{workspaceID}/members:
    parameters:
      - $ref: "#/components/parameters/WorkspaceID"
    get:
      tags: [workspaces]
      summary: List members, owners first
      operationId: listMembers
      responses:
        "200":
          description: Members.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Member" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [workspaces]
      summary: Add an existing user by email (owners only)
      operationId: addMember
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email]
              properties:
                email: { type: string, format: email }
                role: { type: string, enum: [owner, member], default: member }
      responses:
        "201":
          description: Added.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Member" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: "`forbidden`: only owners can add members."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/InvalidInput" }

  /api/v1/jobs:
    get:
      tags: [jobs]
      summary: Search jobs
      description: Jobs are ordered by `last_seen_at` descending, then `id` descending.
      operationId: searchJobs
      parameters:
        - name: q
          in: query
          description: Case-insensitive substring of title, company or location. Wildcards match literally.
          schema: { type: string, maxLength: 200 }
        - name: work_arrangement
          in: query
          schema: { $ref: "#/components/schemas/WorkArrangement" }
        - name: employment_type
          in: query
          schema: { $ref: "#/components/schemas/EmploymentType" }
        - name: seniority
          in: query
          schema: { $ref: "#/components/schemas/Seniority" }
        - name: technology
          in: query
          description: Comma-separated technologies; a job must have all of them. Case-insensitive.
          schema: { type: string }
          example: go,postgresql
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of jobs.
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Job" }
                  next_cursor:
                    type: [string, "null"]
                    description: Pass as `cursor` to fetch the next page; null on the last page.
        "422": { $ref: "#/components/responses/InvalidInput" }
  /api/v1/jobs/{jobID}:
    parameters:
      - $ref: "#/components/parameters/JobID"
    get:
      tags: [jobs]
      summary: Get a job with its source listings
      operationId: getJob
      responses:
        "200":
          description: The job.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/JobDetail" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/workspaces/{workspaceID}/saved-jobs:
    parameters:
      - $ref: "#/components/parameters/WorkspaceID"
    get:
      tags: [saved-jobs]
      summary: List saved jobs, most recently saved first
      operationId: listSavedJobs
      responses:
        "200":
          description: Saved jobs.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/SavedJob" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/workspaces/{workspaceID}/saved-jobs/{jobID}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceID"
      - $ref: "#/components/parameters/JobID"
    put:
      tags: [saved-jobs]
      summary: Save a job (idempotent)
      operationId: saveJob
      responses:
        "204": { description: Saved. }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [saved-jobs]
      summary: Remove a saved job
      operationId: unsaveJob
      responses:
        "204": { description: Removed. }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/workspaces/{workspaceID}/tags:
    parameters:
      - $ref: "#/components/parameters/WorkspaceID"
    get:
      tags: [tags]
      summary: List workspace tags ordered by name
      operationId: listTags
      responses:
        "200":
          description: Tags.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Tag" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [tags]
      summary: Create a tag
      description: Names are trimmed and unique per workspace ignoring case.
      operationId: createTag
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 50 }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Tag" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/InvalidInput" }

  /api/v1/workspaces/{workspaceID}/state/{key}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceID"
      - name: key
        in: path
        required: true
        description: "`jobs_view` (where the user left off in the job browser) or `autofill` (details for filling application forms)."
        schema: { type: string, enum: [jobs_view, autofill] }
    get:
      tags: [workspaces]
      summary: Get the caller's stored state
      operationId: getUserState
      responses:
        "200":
          description: The stored JSON object.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: object, additionalProperties: true }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [workspaces]
      summary: Store the caller's state
      description: Replaces the document. At most 64 KiB; it belongs to the calling user in this workspace.
      operationId: putUserState
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "204": { description: Stored. }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/InvalidInput" }
  /api/v1/workspaces/{workspaceID}/applications:
    parameters:
      - $ref: "#/components/parameters/WorkspaceID"
    get:
      tags: [applications]
      summary: List applications, most recently updated first
      description: Not paginated yet; a workspace is expected to hold a bounded number of applications.
      operationId: listApplications
      parameters:
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/ApplicationStatus" }
      responses:
        "200":
          description: Applications.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Application" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/InvalidInput" }
    post:
      tags: [applications]
      summary: Start tracking a job
      description: Creates the application in `planned` status. A workspace has at most one application per job.
      operationId: createApplication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [job_id]
              properties:
                job_id: { type: string, format: uuid }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Application" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/InvalidInput" }
  /api/v1/workspaces/{workspaceID}/applications/{applicationID}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceID"
      - $ref: "#/components/parameters/ApplicationID"
    get:
      tags: [applications]
      summary: Get an application
      operationId: getApplication
      responses:
        "200":
          description: The application.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Application" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [applications]
      summary: Change application status
      description: |
        Allowed transitions:
        any status may change to any other, so a mistake can be corrected.
        Setting the current status again succeeds without adding history.
      operationId: updateApplication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [status]
              properties:
                status: { $ref: "#/components/schemas/ApplicationStatus" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Application" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`invalid_transition`: the workflow does not allow this change."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/InvalidInput" }
    delete:
      tags: [applications]
      summary: Delete an application
      description: Removes the application with its attempts, events, notes and tags (for example one created by mistake).
      operationId: deleteApplication
      responses:
        "204": { description: Deleted. }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/workspaces/{workspaceID}/applications/{applicationID}/attempts:
    parameters:
      - $ref: "#/components/parameters/WorkspaceID"
      - $ref: "#/components/parameters/ApplicationID"
    get:
      tags: [applications]
      summary: List application attempts in order
      operationId: listAttempts
      responses:
        "200":
          description: Attempts.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Attempt" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [applications]
      summary: Record an application attempt
      description: |
        Attempts are numbered from 1 and never modified. Recording an attempt on a
        planned, rejected or withdrawn application moves it to `applied`.
      operationId: addAttempt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [applied_at]
              properties:
                applied_at:
                  type: string
                  format: date-time
                  description: Any offset is accepted; responses are UTC. At most 24 hours in the future.
                channel: { type: string, maxLength: 100, example: Company site }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Attempt" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/InvalidInput" }
  /api/v1/workspaces/{workspaceID}/applications/{applicationID}/events:
    parameters:
      - $ref: "#/components/parameters/WorkspaceID"
      - $ref: "#/components/parameters/ApplicationID"
    get:
      tags: [applications]
      summary: Application history
      description: Ordered by `occurred_at`, so a back-dated attempt can appear before `created`.
      operationId: listEvents
      responses:
        "200":
          description: Events.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Event" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [applications]
      summary: Add an interview, follow-up or deadline
      operationId: addEvent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [type, occurred_at]
              properties:
                type: { type: string, enum: [interview, follow_up, deadline] }
                occurred_at: { type: string, format: date-time }
                attempt_id:
                  type: string
                  format: uuid
                  description: Must be an attempt of the same application.
                details:
                  type: object
                  description: Free-form JSON object, at most 4096 bytes when encoded.
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Event" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/InvalidInput" }
  /api/v1/workspaces/{workspaceID}/applications/{applicationID}/tags:
    parameters:
      - $ref: "#/components/parameters/WorkspaceID"
      - $ref: "#/components/parameters/ApplicationID"
    get:
      tags: [tags]
      summary: List an application's tags
      operationId: listApplicationTags
      responses:
        "200":
          description: Tags.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Tag" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/workspaces/{workspaceID}/applications/{applicationID}/tags/{tagID}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceID"
      - $ref: "#/components/parameters/ApplicationID"
      - name: tagID
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      tags: [tags]
      summary: Attach a tag (idempotent)
      operationId: tagApplication
      responses:
        "204": { description: Attached. }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [tags]
      summary: Detach a tag
      operationId: untagApplication
      responses:
        "204": { description: Detached. }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/workspaces/{workspaceID}/applications/{applicationID}/notes:
    parameters:
      - $ref: "#/components/parameters/WorkspaceID"
      - $ref: "#/components/parameters/ApplicationID"
    get:
      tags: [notes]
      summary: List notes, oldest first
      operationId: listNotes
      responses:
        "200":
          description: Notes.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Note" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [notes]
      summary: Add a note
      operationId: addNote
      requestBody: { $ref: "#/components/requestBodies/NoteBody" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Note" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/InvalidInput" }
  /api/v1/workspaces/{workspaceID}/applications/{applicationID}/notes/{noteID}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceID"
      - $ref: "#/components/parameters/ApplicationID"
      - name: noteID
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [notes]
      summary: Edit a note
      operationId: updateNote
      requestBody: { $ref: "#/components/requestBodies/NoteBody" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Note" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/InvalidInput" }

  /api/v1/companies:
    post:
      tags: [companies]
      summary: Add a company by its career page
      description: |
        Adds the company to the shared catalog (or returns it if it is already
        there). Known job board URLs are recognised at once; other pages are
        identified by the next research run.
      operationId: addCompany
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [careers_url]
              properties:
                careers_url: { type: string, format: uri, maxLength: 2000 }
                name: { type: string, maxLength: 100 }
      responses:
        "202":
          description: The company is in the catalog.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Company" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "422": { $ref: "#/components/responses/InvalidInput" }
  /api/v1/admin/adapters:
    get:
      tags: [admin]
      summary: List adapter-type reviews (administrator)
      operationId: listAdapterReviews
      responses:
        "200":
          description: Every adapter type and its review.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/AdapterReview" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/admin/adapters/{adapter}:
    patch:
      tags: [admin]
      summary: Review, enable or disable an adapter type (administrator)
      operationId: reviewAdapter
      parameters:
        - name: adapter
          in: path
          required: true
          schema: { type: string, pattern: "^[a-z0-9_]+$" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [enabled]
              properties:
                enabled: { type: boolean }
                note: { type: string, maxLength: 2000, description: Required to enable. }
      responses:
        "200":
          description: The updated review.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/AdapterReview" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/InvalidInput" }
  /api/v1/admin/companies/{companyID}:
    patch:
      tags: [admin]
      summary: Disable or re-enable a company for everyone (administrator)
      operationId: setCompanyDisabled
      parameters:
        - $ref: "#/components/parameters/CompanyID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [disabled]
              properties:
                disabled: { type: boolean }
      responses:
        "200":
          description: The company.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Company" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/admin/llm:
    get:
      tags: [admin]
      summary: State of the optional local language model (administrator)
      description: >
        Lists the server's models and the queue counters; it never runs the
        model. When the feature is off the answer is `{enabled: false}` and no
        network call is made. The API key and the URL path are never returned.
      operationId: getLlmStatus
      responses:
        "200":
          description: Status.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/LlmStatus" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/admin/llm/check:
    post:
      tags: [admin]
      summary: Check the local model with a one-token request (administrator)
      description: Like the status read, plus one tiny completion to prove the model answers. At most one check every 5 seconds.
      operationId: checkLlm
      responses:
        "200":
          description: Status including `probe_ok` and `probe_ms`.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/LlmStatus" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/v1/admin/system:
    get:
      tags: [admin]
      summary: Memory used and allowed per service (administrator)
      description: >
        The API and worker report their own container memory (page cache that the
        kernel can drop is not counted) every 15 seconds; `stale` is true when a
        service has not reported for 90 seconds. Postgres cannot report itself,
        so `limit_bytes` is its Compose memory limit (`note: container`) or the
        ceiling its configuration allows (`note: ceiling`); `used_bytes` is null.
      operationId: getSystem
      responses:
        "200":
          description: The report.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [host_total_bytes, services, postgres]
                    properties:
                      host_total_bytes: { type: integer, format: int64 }
                      services:
                        type: array
                        items:
                          type: object
                          required: [name, used_bytes, limit_bytes, estimated, stale]
                          properties:
                            name: { type: string, enum: [api, worker, postgres, web] }
                            used_bytes: { type: [integer, "null"], format: int64 }
                            limit_bytes: { type: [integer, "null"], format: int64 }
                            heap_bytes: { type: integer, format: int64 }
                            estimated: { type: boolean }
                            stale: { type: boolean }
                            updated_at: { type: string, format: date-time }
                            note: { type: string, enum: [ceiling, container] }
                      postgres:
                        type: object
                        required: [shared_buffers_bytes, work_mem_bytes, max_connections, connections, database_bytes]
                        properties:
                          shared_buffers_bytes: { type: integer, format: int64 }
                          work_mem_bytes: { type: integer, format: int64 }
                          max_connections: { type: integer }
                          connections: { type: integer }
                          database_bytes: { type: integer, format: int64 }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/admin/users:
    get:
      tags: [admin]
      summary: List accounts (administrator)
      operationId: listUsers
      responses:
        "200":
          description: Every account, oldest first.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/User" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [admin]
      summary: Add an account (administrator)
      description: >
        Creates a regular account with its own personal workspace. The new user
        is not signed in. This is how people are added after the first account.
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password, display_name]
              properties:
                email: { type: string, format: email, maxLength: 254 }
                password: { type: string, minLength: 12, maxLength: 128 }
                display_name: { type: string, minLength: 1, maxLength: 100 }
                locale: { type: string, enum: [tr, en], default: tr }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: "`conflict`: the email is already registered."
        "422": { $ref: "#/components/responses/InvalidInput" }
  /api/v1/admin/llm/config:
    get:
      tags: [admin]
      summary: AI connection in effect (administrator)
      description: >
        The base URL, model and whether an API key is set, with a hint of its last
        four characters. The key itself is never returned.
      operationId: getLlmConfig
      responses:
        "200":
          description: The effective configuration.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/LlmConfig" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      tags: [admin]
      summary: Change the AI connection (administrator)
      description: >
        Saves the connection in the database; it takes effect within seconds, with
        no restart. A field left out stays as it is. An empty string removes the
        saved value so the environment default applies again. `api_key` is stored
        as given and never returned.
      operationId: putLlmConfig
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                enabled: { type: boolean }
                base_url: { type: string, description: "An OpenAI-compatible endpoint such as https://api.openai.com/v1." }
                model: { type: string }
                api_key: { type: string }
                background: { type: boolean, description: Let the worker read the whole catalog on its own. }
                reset_background: { type: boolean, description: Return `background` to automatic (on for a local model, off for a hosted service). }
      responses:
        "200":
          description: The new effective configuration.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/LlmConfig" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/InvalidInput" }
  /api/v1/admin/crawl/config:
    get:
      tags: [admin]
      summary: Crawl pace in effect (administrator)
      description: >
        How many companies are worked on at once and how closely requests are
        spaced, with the environment defaults and which values were saved in the app.
      operationId: getCrawlPace
      responses:
        "200":
          description: The effective pace.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/CrawlPace" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      tags: [admin]
      summary: Change the crawl pace (administrator)
      description: >
        Saves the pace in the database; the worker follows within seconds, with no
        restart. A field left out stays as it is; `0` removes the saved value so
        the environment default applies again.
      operationId: putCrawlPace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                concurrency: { type: integer, minimum: 0, maximum: 1024, description: Companies detected and synced at once. }
                host_interval_ms: { type: integer, minimum: 0, maximum: 60000, description: "Gap between requests to one ordinary host (at least 100)." }
                vendor_concurrency: { type: integer, minimum: 0, maximum: 128, description: Parallel requests to one job board API. }
                vendor_interval_ms: { type: integer, minimum: 0, maximum: 10000, description: "Gap between requests to one job board API (at least 10)." }
      responses:
        "200":
          description: The new effective pace.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/CrawlPace" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/InvalidInput" }
  /api/v1/admin/settings:
    get:
      tags: [admin]
      summary: Crawl settings in effect (administrator, read-only)
      operationId: getCrawlSettings
      responses:
        "200":
          description: Name and value of each crawl setting.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [name, value]
                      properties:
                        name: { type: string }
                        value: { type: string }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/workspaces/{workspaceID}/context:
    parameters:
      - $ref: "#/components/parameters/WorkspaceID"
    get:
      tags: [research]
      summary: What the AI knows about the person (note and CV)
      operationId: getWorkspaceContext
      responses:
        "200":
          description: The note and the CV, if one was uploaded.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/WorkspaceContext" }
    put:
      tags: [research]
      summary: Save the note about the work the person looks for
      operationId: putWorkspaceContext
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [about]
              properties:
                about: { type: string, maxLength: 4000 }
      responses:
        "200":
          description: The saved context.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/WorkspaceContext" }
        "422": { $ref: "#/components/responses/InvalidInput" }
  /api/v1/workspaces/{workspaceID}/context/cv:
    parameters:
      - $ref: "#/components/parameters/WorkspaceID"
    post:
      tags: [research]
      summary: Upload a CV
      description: >
        Reads the text of a PDF, Word (.docx) or text file (at most 5 MB) and
        keeps it with what was read from it: the technologies the rules find
        and, when AI is on, titles, seniority, experience and a summary. It
        replaces the previous CV and drops the stored match explanations, which
        are written again from the new CV. Shares the on-demand AI rate limit.
      operationId: uploadCV
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "200":
          description: The context with the CV.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/WorkspaceContext" }
        "422": { $ref: "#/components/responses/InvalidInput" }
    delete:
      tags: [research]
      summary: Delete the CV
      operationId: deleteCV
      responses:
        "204": { description: Deleted. }
  /api/v1/workspaces/{workspaceID}/research-profiles/suggest:
    parameters:
      - $ref: "#/components/parameters/WorkspaceID"
    post:
      tags: [research]
      summary: Draft a research profile with AI
      description: >
        Turns a free-text description of the wanted job into a profile draft
        (titles, keywords, technologies, countries, remote preference,
        seniority). Nothing is saved; create the profile with the normal call
        after reviewing it. Uses the AI connection from Settings and shares the
        on-demand AI rate limit. The AI also draws on what it knows about the
        person (their note, their CV, their other searches), so a short
        description grows into a full profile; with such a background the
        description may be left empty.
      operationId: suggestResearchProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [description]
              properties:
                description: { type: string, maxLength: 2000, description: At least 10 characters unless the AI already knows the person. }
      responses:
        "200":
          description: The draft.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [name, title_keywords, keywords, technologies, countries, locations, excluded_keywords, remote, seniority, schedule_hours]
                    properties:
                      name: { type: string }
                      title_keywords: { type: array, items: { type: string } }
                      keywords: { type: array, items: { type: string } }
                      technologies: { type: array, items: { type: string } }
                      countries: { type: array, items: { type: string } }
                      locations: { type: array, items: { type: string } }
                      excluded_keywords: { type: array, items: { type: string } }
                      remote: { type: string, enum: [any, remote_only, remote_or_hybrid, onsite_ok] }
                      seniority: { type: array, items: { type: string } }
                      schedule_hours: { type: integer }
        "412":
          description: "`ai_disabled`: AI is switched off."
        "422": { $ref: "#/components/responses/InvalidInput" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502":
          description: "`ai_failed`: the model's answer was unusable."
        "503":
          description: "`ai_unavailable`: the AI service could not be reached."
  /api/v1/workspaces/{workspaceID}/research-profiles:
    parameters:
      - $ref: "#/components/parameters/WorkspaceID"
    get:
      tags: [research]
      summary: List research profiles
      operationId: listResearchProfiles
      responses:
        "200":
          description: The workspace's profiles, oldest first.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/ResearchProfile" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [research]
      summary: Create a research profile
      operationId: createResearchProfile
      requestBody: { $ref: "#/components/requestBodies/ResearchProfileBody" }
      responses:
        "201":
          description: The new profile.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/ResearchProfile" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/InvalidInput" }
  /api/v1/workspaces/{workspaceID}/research-profiles/{profileID}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceID"
      - $ref: "#/components/parameters/ProfileID"
    get:
      tags: [research]
      summary: Get a research profile
      operationId: getResearchProfile
      responses:
        "200":
          description: The profile.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/ResearchProfile" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [research]
      summary: Update a research profile
      description: Fields that are absent keep their value.
      operationId: updateResearchProfile
      requestBody: { $ref: "#/components/requestBodies/ResearchProfileBody" }
      responses:
        "200":
          description: The updated profile.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/ResearchProfile" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/InvalidInput" }
    delete:
      tags: [research]
      summary: Delete a research profile and its runs and matches
      operationId: deleteResearchProfile
      responses:
        "204": { description: Deleted. }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/workspaces/{workspaceID}/research-profiles/{profileID}/runs:
    parameters:
      - $ref: "#/components/parameters/WorkspaceID"
      - $ref: "#/components/parameters/ProfileID"
    post:
      tags: [research]
      summary: Start a research run now
      operationId: startResearchRun
      responses:
        "202":
          description: The queued run.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/ResearchRun" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/workspaces/{workspaceID}/research-runs:
    parameters:
      - $ref: "#/components/parameters/WorkspaceID"
    get:
      tags: [research]
      summary: List research runs, newest first
      operationId: listResearchRuns
      parameters:
        - name: profile
          in: query
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Runs.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/ResearchRun" }
        "422": { $ref: "#/components/responses/InvalidInput" }
  /api/v1/workspaces/{workspaceID}/activity:
    parameters:
      - $ref: "#/components/parameters/WorkspaceID"
    get:
      tags: [research]
      summary: Daily activity series for the dashboard
      description: >
        Zero-filled UTC days, oldest first; index i of every array belongs to
        days[i]. Matches and applications are the workspace's; jobs are the
        shared catalog (new jobs that are still open).
      operationId: getActivity
      parameters:
        - name: days
          in: query
          schema: { type: integer, minimum: 1, maximum: 90, default: 14 }
      responses:
        "200":
          description: Series.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [days, new_matches, jobs_collected, applications_created, upcoming_interviews]
                    properties:
                      days: { type: array, items: { type: string, format: date } }
                      new_matches: { type: array, items: { type: integer } }
                      jobs_collected: { type: array, items: { type: integer } }
                      applications_created: { type: array, items: { type: integer } }
                      upcoming_interviews: { type: integer }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/InvalidInput" }
  /api/v1/workspaces/{workspaceID}/research-runs/{runID}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceID"
      - $ref: "#/components/parameters/RunID"
    get:
      tags: [research]
      summary: Get a research run with its stage progress
      operationId: getResearchRun
      responses:
        "200":
          description: The run.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/ResearchRun" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/workspaces/{workspaceID}/research-runs/{runID}/events:
    parameters:
      - $ref: "#/components/parameters/WorkspaceID"
      - $ref: "#/components/parameters/RunID"
    get:
      tags: [research]
      summary: Read a run's log
      description: Returns lines after `after`, oldest first. The newest 2000 lines of a run are kept.
      operationId: listResearchRunEvents
      parameters:
        - name: after
          in: query
          schema: { type: integer, minimum: 0 }
        - name: level
          in: query
          description: "`warn` returns warnings and errors, `error` only errors."
          schema: { type: string, enum: [warn, error] }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 200 }
      responses:
        "200":
          description: Log lines.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/RunEvent" }
        "422": { $ref: "#/components/responses/InvalidInput" }
  /api/v1/workspaces/{workspaceID}/research-runs/{runID}/cancel:
    parameters:
      - $ref: "#/components/parameters/WorkspaceID"
      - $ref: "#/components/parameters/RunID"
    post:
      tags: [research]
      summary: Cancel a queued or running run
      description: A queued run is cancelled at once; a running run stops at its next progress report.
      operationId: cancelResearchRun
      responses:
        "202":
          description: The run.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/ResearchRun" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/workspaces/{workspaceID}/companies:
    parameters:
      - $ref: "#/components/parameters/WorkspaceID"
    get:
      tags: [companies]
      summary: Browse the company catalog
      description: Ordered by name. `blocked` tells whether this workspace blocked the company.
      operationId: listCompanies
      parameters:
        - name: q
          in: query
          schema: { type: string, maxLength: 200 }
        - name: ats
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/CompanyStatus" }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of companies.
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Company" }
                  next_cursor: { type: [string, "null"] }
        "422": { $ref: "#/components/responses/InvalidInput" }
  /api/v1/workspaces/{workspaceID}/company-blocks/{companyID}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceID"
      - $ref: "#/components/parameters/CompanyID"
    put:
      tags: [companies]
      summary: Hide a company's jobs in this workspace
      operationId: blockCompany
      responses:
        "204": { description: Blocked (also when it already was). }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [companies]
      summary: Show a blocked company's jobs again
      operationId: unblockCompany
      responses:
        "204": { description: Unblocked. }

  /api/v1/workspaces/{workspaceID}/jobs:
    parameters:
      - $ref: "#/components/parameters/WorkspaceID"
    get:
      tags: [jobs]
      summary: Browse jobs as this workspace sees them
      description: |
        Jobs from companies the workspace blocked and closed jobs (unless
        `closed=true`) are left out. `sort=recent` orders by first seen,
        `score` by match score (needs `profile`), `relevance` by full-text
        rank (needs `q`, at most 2000 results).
      operationId: listWorkspaceJobs
      parameters:
        - name: q
          in: query
          description: Full-text search (websearch syntax) over title, company, technologies and description.
          schema: { type: string, maxLength: 200 }
        - name: profile
          in: query
          description: Only the profile's matches, with their scores.
          schema: { type: string, format: uuid }
        - name: posted
          in: query
          schema: { type: string, enum: [24h, 7d, 30d] }
        - name: arrangement
          in: query
          schema: { $ref: "#/components/schemas/WorkArrangement" }
        - name: seniority
          in: query
          schema: { $ref: "#/components/schemas/Seniority" }
        - name: employment_type
          in: query
          schema: { $ref: "#/components/schemas/EmploymentType" }
        - name: technology
          in: query
          description: Repeat or comma-separate; a job must have all of them.
          schema: { type: array, items: { type: string } }
          explode: true
        - name: country
          in: query
          schema: { type: array, items: { type: string, pattern: "^[A-Za-z]{2}$" } }
          explode: true
        - name: region
          in: query
          description: >-
            A named group of countries, such as emea or europe; its countries
            are added to those in `country`. Repeatable.
          schema: { type: array, items: { type: string, enum: [europe, eu, emea, mena, dach, nordics, benelux, north america, americas, latam, apac, uk] } }
          explode: true
        - name: location
          in: query
          description: >-
            Text found in the job's location, ignoring case and diacritics
            ("izmir" finds "İzmir"). At most 80 characters.
          schema: { type: string, maxLength: 80 }
        - name: ats
          in: query
          description: Keep jobs read from one job board system, such as lever or greenhouse.
          schema: { type: string, pattern: "^[a-z][a-z0-9_]{1,31}$" }
        - name: company
          in: query
          schema: { type: array, items: { type: string, format: uuid } }
          explode: true
        - name: closed
          in: query
          description: Include jobs that are no longer listed.
          schema: { type: boolean, default: false }
        - name: sort
          in: query
          schema: { type: string, enum: [recent, score, relevance], default: recent }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of jobs.
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/WorkspaceJob" }
                  next_cursor: { type: [string, "null"] }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/InvalidInput" }
  /api/v1/workspaces/{workspaceID}/jobs/{jobID}/analyze:
    parameters:
      - $ref: "#/components/parameters/WorkspaceID"
      - $ref: "#/components/parameters/JobID"
      - name: profile
        in: query
        required: true
        description: The research profile whose match is explained.
        schema: { type: string, format: uuid }
      - name: lang
        in: query
        description: Language of the explanation; defaults to the workspace owner's.
        schema: { type: string, enum: [tr, en] }
    post:
      tags: [jobs]
      summary: Generate the AI reading and match explanation of one job on request
      description: >
        Reads the posting with the configured model if that has not happened yet and
        writes why it matches the profile, at any score. This is how a weak match
        gets AI text. It can take several seconds. The result is stored.
        412 `ai_disabled`: AI is switched off. 503 `ai_unavailable`: the service
        cannot be reached or the key is refused. 502 `ai_failed`: the answer was unusable.
      operationId: analyzeJob
      responses:
        "200":
          description: The explanation and what the model read from the job.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [explanation, ai]
                    properties:
                      explanation: { type: string }
                      ai: { $ref: "#/components/schemas/JobAI" }
        "404": { $ref: "#/components/responses/NotFound" }
        "412": { description: AI is switched off., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "422": { $ref: "#/components/responses/InvalidInput" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { description: The AI answered with something unusable., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "503": { description: The AI service could not be reached., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /api/v1/workspaces/{workspaceID}/jobs/{jobID}/summary:
    parameters:
      - $ref: "#/components/parameters/WorkspaceID"
      - $ref: "#/components/parameters/JobID"
      - name: lang
        in: query
        description: Language of the summary.
        schema: { type: string, enum: [tr, en], default: en }
    get:
      tags: [jobs]
      summary: A short summary of the job in one language
      description: |
        Written by the local model on first request and stored. While the model is still
        writing it the source is `pending`; ask again a few seconds later.
        `unavailable` means the model is off, unreachable or answered badly.
      operationId: getJobSummary
      responses:
        "200":
          description: The summary state.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [summary, source]
                    properties:
                      summary: { type: [string, "null"] }
                      source: { type: string, enum: [ai, pending, unavailable] }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/InvalidInput" }
  /api/v1/workspaces/{workspaceID}/jobs/{jobID}/summary/stream:
    parameters:
      - $ref: "#/components/parameters/WorkspaceID"
      - $ref: "#/components/parameters/JobID"
      - name: lang
        in: query
        description: Language of the summary.
        schema: { type: string, enum: [tr, en], default: en }
    get:
      tags: [jobs]
      summary: The job summary as server-sent events
      description: |
        The same summary as `getJobSummary`, streamed as the model writes it.
        `delta` events carry `{"text": "..."}` pieces to append; the last event is
        `done` with `{"summary": "..."}` (the checked text, which replaces what was
        shown) or `unavailable` (discard what was shown). A stored summary arrives
        as one `delta` followed by `done`. Requests for the same job and language
        share one model run.
      operationId: streamJobSummary
      responses:
        "200":
          description: An event stream.
          content:
            text/event-stream:
              schema: { type: string }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/InvalidInput" }
  /api/v1/workspaces/{workspaceID}/jobs/facets:
    parameters:
      - $ref: "#/components/parameters/WorkspaceID"
    get:
      tags: [jobs]
      summary: Count jobs by filter values
      description: Each dimension is counted with every other filter applied, but not its own.
      operationId: getWorkspaceJobFacets
      parameters:
        - name: q
          in: query
          description: Full-text search (websearch syntax) over title, company, technologies and description.
          schema: { type: string, maxLength: 200 }
        - name: profile
          in: query
          description: Only the profile's matches, with their scores.
          schema: { type: string, format: uuid }
        - name: posted
          in: query
          schema: { type: string, enum: [24h, 7d, 30d] }
        - name: arrangement
          in: query
          schema: { $ref: "#/components/schemas/WorkArrangement" }
        - name: seniority
          in: query
          schema: { $ref: "#/components/schemas/Seniority" }
        - name: employment_type
          in: query
          schema: { $ref: "#/components/schemas/EmploymentType" }
        - name: technology
          in: query
          description: Repeat or comma-separate; a job must have all of them.
          schema: { type: array, items: { type: string } }
          explode: true
        - name: country
          in: query
          schema: { type: array, items: { type: string, pattern: "^[A-Za-z]{2}$" } }
          explode: true
        - name: region
          in: query
          description: >-
            A named group of countries, such as emea or europe; its countries
            are added to those in `country`. Repeatable.
          schema: { type: array, items: { type: string, enum: [europe, eu, emea, mena, dach, nordics, benelux, north america, americas, latam, apac, uk] } }
          explode: true
        - name: location
          in: query
          description: >-
            Text found in the job's location, ignoring case and diacritics
            ("izmir" finds "İzmir"). At most 80 characters.
          schema: { type: string, maxLength: 80 }
        - name: ats
          in: query
          description: Keep jobs read from one job board system, such as lever or greenhouse.
          schema: { type: string, pattern: "^[a-z][a-z0-9_]{1,31}$" }
        - name: company
          in: query
          schema: { type: array, items: { type: string, format: uuid } }
          explode: true
        - name: closed
          in: query
          description: Include jobs that are no longer listed.
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Counts.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/JobFacets" }
        "422": { $ref: "#/components/responses/InvalidInput" }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: rolescout_session
      description: HttpOnly, SameSite=Lax session cookie set by register and login.

  headers:
    SessionCookie:
      description: "`rolescout_session=<token>; Path=/; HttpOnly; SameSite=Lax; Secure` (Secure unless COOKIE_SECURE=false)."
      schema: { type: string }

  parameters:
    WorkspaceID:
      name: workspaceID
      in: path
      required: true
      schema: { type: string, format: uuid }
    JobID:
      name: jobID
      in: path
      required: true
      schema: { type: string, format: uuid }
    ProfileID:
      name: profileID
      in: path
      required: true
      schema: { type: string, format: uuid }
    RunID:
      name: runID
      in: path
      required: true
      schema: { type: string, format: uuid }
    CompanyID:
      name: companyID
      in: path
      required: true
      schema: { type: string, format: uuid }
    ApplicationID:
      name: applicationID
      in: path
      required: true
      schema: { type: string, format: uuid }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Cursor:
      name: cursor
      in: query
      description: Opaque value from a previous page's `next_cursor`.
      schema: { type: string }

  requestBodies:
    NoteBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [body]
            properties:
              body: { type: string, minLength: 1, maxLength: 10000 }

    ResearchProfileBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            properties:
              name: { type: string, minLength: 1, maxLength: 100 }
              title_keywords: { $ref: "#/components/schemas/KeywordList" }
              keywords: { $ref: "#/components/schemas/KeywordList" }
              technologies: { $ref: "#/components/schemas/KeywordList" }
              countries:
                type: array
                maxItems: 30
                items: { type: string, pattern: "^[A-Za-z]{2}$" }
              locations: { $ref: "#/components/schemas/KeywordList" }
              excluded_keywords: { $ref: "#/components/schemas/KeywordList" }
              remote: { $ref: "#/components/schemas/RemotePreference" }
              seniority:
                type: array
                items: { type: string, enum: [intern, junior, mid, senior, lead] }
              schedule_hours: { type: integer, minimum: 1, maximum: 336 }
              schedule_enabled: { type: boolean, description: "false pauses automatic runs; manual runs still work." }

  responses:
    Forbidden:
      description: "`forbidden`: only the installation administrator may do this."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthenticated:
      description: "`unauthenticated`: no valid session cookie."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    BadRequest:
      description: "`bad_request`: the body is missing, not JSON, or has unknown fields."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: "`not_found`: the resource does not exist in this workspace, or an ID is malformed."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: "`conflict`: the resource already exists."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    InvalidInput:
      description: "`invalid_input`: one or more fields are invalid; see `fields`."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RateLimited:
      description: "`rate_limited`: too many attempts from this IP address; try again later."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [bad_request, unauthenticated, invalid_credentials, forbidden,
                registration_closed, not_found, conflict, invalid_transition, invalid_input,
                method_not_allowed, payload_too_large, internal, error]
            message: { type: string }
            fields:
              type: array
              items:
                type: object
                required: [field, message]
                properties:
                  field: { type: string }
                  message: { type: string }
      example:
        error:
          code: invalid_input
          message: The request contains invalid fields.
          fields:
            - field: limit
              message: must be an integer between 1 and 100
    User:
      type: object
      required: [id, email, display_name, locale, is_admin, created_at]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        display_name: { type: string }
        locale: { type: string, enum: [tr, en] }
        is_admin: { type: boolean, description: The installation administrator (the first account). }
        created_at: { type: string, format: date-time }
    Workspace:
      type: object
      required: [id, name, role, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        role: { type: string, enum: [owner, member], description: The caller's role. }
        created_at: { type: string, format: date-time }
    Member:
      type: object
      required: [user_id, email, display_name, role, joined_at]
      properties:
        user_id: { type: string, format: uuid }
        email: { type: string, format: email }
        display_name: { type: string }
        role: { type: string, enum: [owner, member] }
        joined_at: { type: string, format: date-time }
    WorkArrangement:
      type: string
      enum: [onsite, hybrid, remote, unknown]
    EmploymentType:
      type: string
      enum: [full_time, part_time, contract, internship, temporary, unknown]
    Seniority:
      type: string
      enum: [intern, junior, mid, senior, lead, unknown]
    ApplicationStatus:
      type: string
      enum: [planned, applied, interviewing, offer, accepted, rejected, withdrawn]
    Job:
      type: object
      required: [id, title, company_name, location, work_arrangement, employment_type,
        seniority, technologies, description, first_seen_at, last_seen_at]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        company_name: { type: string }
        company_id: { type: [string, "null"], format: uuid }
        country_code: { type: [string, "null"], description: ISO 3166-1 alpha-2 when known. }
        closed_at: { type: [string, "null"], format: date-time, description: Set when no source lists the job any more. }
        location: { type: [string, "null"] }
        work_arrangement: { $ref: "#/components/schemas/WorkArrangement" }
        employment_type: { $ref: "#/components/schemas/EmploymentType" }
        seniority: { $ref: "#/components/schemas/Seniority" }
        technologies:
          type: array
          items: { type: string }
          description: Lower-case.
        description: { type: string }
        first_seen_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
    JobDetail:
      allOf:
        - $ref: "#/components/schemas/Job"
        - type: object
          required: [listings, ai]
          properties:
            ai: { $ref: "#/components/schemas/JobAI" }
            listings:
              type: array
              items: { $ref: "#/components/schemas/Listing" }
    Listing:
      type: object
      required: [id, source_id, url, source_posted_at, source_updated_at, last_ingested_at]
      properties:
        id: { type: string, format: uuid }
        source_id: { type: string, format: uuid }
        url: { type: string, format: uri, description: Original listing URL. }
        source_posted_at: { type: [string, "null"], format: date-time }
        source_updated_at: { type: [string, "null"], format: date-time }
        last_ingested_at: { type: string, format: date-time }
    SavedJob:
      type: object
      required: [saved_at, saved_by, job]
      properties:
        saved_at: { type: string, format: date-time }
        saved_by: { type: [string, "null"], format: uuid }
        job: { $ref: "#/components/schemas/Job" }
    Application:
      type: object
      required: [id, job_id, status, created_by, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        job_id: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/ApplicationStatus" }
        created_by: { type: [string, "null"], format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Attempt:
      type: object
      required: [id, attempt_number, applied_at, channel, created_by, created_at]
      properties:
        id: { type: string, format: uuid }
        attempt_number: { type: integer, minimum: 1 }
        applied_at: { type: string, format: date-time }
        channel: { type: string }
        created_by: { type: [string, "null"], format: uuid }
        created_at: { type: string, format: date-time }
    Event:
      type: object
      required: [id, type, attempt_id, from_status, to_status, occurred_at, details, created_by, created_at]
      properties:
        id: { type: string, format: uuid }
        type:
          type: string
          enum: [created, status_changed, attempt_added, interview, follow_up, deadline]
        attempt_id: { type: [string, "null"], format: uuid }
        from_status:
          oneOf:
            - $ref: "#/components/schemas/ApplicationStatus"
            - type: "null"
        to_status:
          oneOf:
            - $ref: "#/components/schemas/ApplicationStatus"
            - type: "null"
        occurred_at: { type: string, format: date-time }
        details: { type: object }
        created_by: { type: [string, "null"], format: uuid }
        created_at: { type: string, format: date-time }
    Tag:
      type: object
      required: [id, name, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        created_at: { type: string, format: date-time }
    Note:
      type: object
      required: [id, author_id, body, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        author_id: { type: [string, "null"], format: uuid }
        body: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    KeywordList:
      type: array
      maxItems: 30
      items: { type: string, maxLength: 60 }
    RemotePreference:
      type: string
      enum: [any, remote_only, remote_or_hybrid, onsite_ok]
    ResearchProfile:
      type: object
      required: [id, name, title_keywords, keywords, technologies, countries, locations,
        excluded_keywords, remote, seniority, schedule_hours, schedule_enabled, last_run_at, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        title_keywords: { type: array, items: { type: string } }
        keywords: { type: array, items: { type: string } }
        technologies: { type: array, items: { type: string } }
        countries: { type: array, items: { type: string } }
        locations: { type: array, items: { type: string } }
        excluded_keywords: { type: array, items: { type: string } }
        remote: { $ref: "#/components/schemas/RemotePreference" }
        seniority: { type: array, items: { type: string } }
        schedule_hours: { type: integer }
        schedule_enabled: { type: boolean }
        last_run_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    StageProgress:
      type: object
      required: [state, total, done, failed, detail, note, started_at, finished_at]
      properties:
        state: { type: string, enum: [pending, running, done, skipped, failed] }
        total: { type: integer }
        done: { type: integer }
        failed: { type: integer }
        detail:
          type: object
          additionalProperties: { type: integer }
          description: Counts such as companies per job board system or jobs collected.
        note: { type: string }
        started_at: { type: [string, "null"], format: date-time }
        finished_at: { type: [string, "null"], format: date-time }
    ResearchRun:
      type: object
      required: [id, profile_id, state, stage, stages, trigger, error, cancel_requested, summary,
        queued_at, started_at, finished_at]
      properties:
        id: { type: string, format: uuid }
        profile_id: { type: string, format: uuid }
        state: { type: string, enum: [queued, running, succeeded, failed, cancelled] }
        stage: { type: string, enum: [discovery, detection, collection, scoring, result] }
        stages:
          type: object
          required: [discovery, detection, collection, scoring, result]
          additionalProperties: { $ref: "#/components/schemas/StageProgress" }
        trigger: { type: string, enum: [manual, schedule] }
        error: { type: [string, "null"] }
        cancel_requested: { type: boolean }
        summary:
          type: object
          additionalProperties: { type: integer }
          description: companies_known, companies_checked, companies_failed, jobs_collected, jobs_open, matches, new_matches.
        queued_at: { type: string, format: date-time }
        started_at: { type: [string, "null"], format: date-time }
        finished_at: { type: [string, "null"], format: date-time }
    RunEvent:
      type: object
      required: [id, at, level, stage, company, message]
      properties:
        id: { type: integer }
        at: { type: string, format: date-time }
        level: { type: string, enum: [info, warn, error] }
        stage: { type: string }
        company: { type: string }
        message: { type: string }
    CompanyStatus:
      type: string
      enum: [pending, active, empty, unreachable, blocked_by_robots, disabled]
    Company:
      type: object
      required: [id, name, careers_url, ats, status, origin, open_jobs, last_checked_at, last_error, blocked]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        careers_url: { type: string, format: uri }
        ats: { type: string, description: "Job board system: greenhouse, lever, ashby, workable, recruitee, personio, bamboohr, workday, teamtailor, breezy, rippling, gem, jsonld or unknown." }
        status: { $ref: "#/components/schemas/CompanyStatus" }
        origin: { type: string, enum: [seed, hackernews, list, link, manual, probe] }
        open_jobs: { type: integer }
        last_checked_at: { type: [string, "null"], format: date-time }
        last_error: { type: [string, "null"] }
        blocked: { type: boolean }
    AdapterReview:
      type: object
      required: [adapter, enabled, reviewed_at, note]
      properties:
        adapter: { type: string }
        enabled: { type: boolean }
        reviewed_at: { type: [string, "null"], format: date-time }
        note: { type: [string, "null"] }
    WorkspaceContext:
      type: object
      required: [about, cv, ai_read]
      properties:
        about: { type: string }
        ai_read: { type: boolean, description: Whether the AI read the CV; without it only technologies are known. }
        cv:
          type: [object, "null"]
          required: [filename, uploaded_at, chars, skills, titles, seniority, years, summary]
          properties:
            filename: { type: string }
            uploaded_at: { type: string, format: date-time }
            chars: { type: integer }
            skills: { type: array, items: { type: string } }
            titles: { type: array, items: { type: string } }
            seniority: { type: string }
            years: { type: [integer, "null"] }
            summary: { type: string }
    TechFit:
      type: object
      description: The job's technologies compared with the person's (profile and CV).
      required: [matched, missing, excluded, from_cv]
      properties:
        matched: { type: array, items: { type: string } }
        missing: { type: array, items: { type: string }, description: Technologies the person does not have. }
        excluded: { type: array, items: { type: string }, description: Missing ones the person ruled out. }
        from_cv: { type: boolean }
    WorkspaceJob:
      allOf:
        - $ref: "#/components/schemas/Job"
        - type: object
          required: [saved, match, ai, tech_fit]
          properties:
            saved: { type: boolean }
            tech_fit:
              oneOf:
                - $ref: "#/components/schemas/TechFit"
                - type: "null"
            ai: { $ref: "#/components/schemas/JobAI" }
            match:
              type: [object, "null"]
              required: [score, new, reasons, explanation]
              properties:
                explanation: { type: [string, "null"], description: A short reason written by the local model, in the workspace owner's language. }
                score: { type: integer, minimum: 0, maximum: 100 }
                new: { type: boolean, description: First seen since the profile's previous run. }
                reasons:
                  type: array
                  items:
                    type: object
                    required: [code]
                    properties:
                      code: { type: string, enum: [title, keyword, role, tech, remote, remote_abroad, country, location, region, hybrid, seniority, fresh] }
                      params: { type: object, additionalProperties: { type: string } }
    CrawlPaceValues:
      type: object
      required: [concurrency, host_interval_ms, vendor_concurrency, vendor_interval_ms]
      properties:
        concurrency: { type: integer }
        host_interval_ms: { type: integer }
        vendor_concurrency: { type: integer }
        vendor_interval_ms: { type: integer }
    CrawlPace:
      allOf:
        - $ref: "#/components/schemas/CrawlPaceValues"
        - type: object
          required: [defaults, stored]
          properties:
            defaults: { $ref: "#/components/schemas/CrawlPaceValues" }
            stored:
              type: object
              additionalProperties: { type: boolean }
    LlmConfig:
      type: object
      required: [enabled, base_url, model, has_api_key, background, background_auto, local, stored]
      properties:
        enabled: { type: boolean }
        base_url: { type: string }
        model: { type: string }
        has_api_key: { type: boolean }
        api_key_hint: { type: string, description: Last four characters of the key. }
        background: { type: boolean }
        background_auto: { type: boolean, description: Nobody chose; it follows where the model runs. }
        local: { type: boolean }
        stored:
          type: object
          description: Which values are saved in the web app (the rest come from the environment).
          additionalProperties: { type: boolean }
    LlmStatus:
      type: object
      required: [enabled, reachable, model_present, degraded, local, queue, enriched, failed, avg_latency_ms, last_checked_at, probe_ok, probe_ms]
      properties:
        enabled: { type: boolean }
        base_host: { type: string, description: Host and port of the model server only. }
        model: { type: string }
        fallback_model: { type: string }
        reachable: { type: boolean }
        model_present: { type: boolean }
        degraded: { type: boolean, description: Only the fallback model has worked recently. }
        local: { type: boolean, description: False when the host is not this machine or a private network; job text is then sent to it. }
        queue: { type: integer }
        enriched: { type: integer }
        failed: { type: integer }
        avg_latency_ms: { type: integer }
        last_error: { type: string }
        last_checked_at: { type: [string, "null"], format: date-time }
        probe_ok: { type: boolean }
        probe_ms: { type: integer }
    JobAI:
      type: [object, "null"]
      description: What the local model added. Null when the model has not read the job or added nothing.
      required: [model, summary, remote_policy, salary, fields, extra_technologies]
      properties:
        model: { type: string }
        summary: { type: [string, "null"] }
        remote_policy: { type: [string, "null"] }
        salary:
          type: [object, "null"]
          required: [min, max, currency, period]
          properties:
            min: { type: [integer, "null"] }
            max: { type: [integer, "null"] }
            currency: { type: string }
            period: { type: string, enum: [year, month, day, hour] }
        fields:
          type: array
          description: Effective values the model filled because the rules did not know them.
          items: { type: string, enum: [seniority, work_arrangement, country] }
        extra_technologies: { type: array, items: { type: string } }
    FacetCount:
      type: object
      required: [value, label, count]
      properties:
        value: { type: string }
        label: { type: string }
        count: { type: integer }
    JobFacets:
      type: object
      required: [posted, arrangement, seniority, country, technologies, companies]
      properties:
        posted: { type: object, additionalProperties: { type: integer }, description: Keys 24h, 7d and 30d. }
        arrangement: { type: object, additionalProperties: { type: integer } }
        seniority: { type: object, additionalProperties: { type: integer } }
        country: { type: object, additionalProperties: { type: integer } }
        technologies: { type: array, items: { $ref: "#/components/schemas/FacetCount" }, description: Top 20. }
        companies: { type: array, items: { $ref: "#/components/schemas/FacetCount" }, description: "Top 20; value is the company ID." }
