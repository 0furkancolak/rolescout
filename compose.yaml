services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rolescout}
      POSTGRES_USER: ${POSTGRES_USER:-rolescout}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - rolescout_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 15

  api:
    build:
      context: ./api
      args:
        APP: api
        VERSION: ${ROLESCOUT_VERSION:-dev}
    restart: unless-stopped
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 8080
      DATABASE_URL: "postgres://${POSTGRES_USER:-rolescout}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-rolescout}?sslmode=disable"
      MIGRATIONS_DIR: /app/migrations
      # Local HTTP only. Set COOKIE_SECURE=true when serving over HTTPS.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-false}
      SESSION_TTL: ${SESSION_TTL:-720h}
      # nginx forwards the client address in X-Real-IP from the Compose network.
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-172.16.0.0/12,10.0.0.0/8,192.168.0.0/16}
      LOGIN_RATE_LIMIT: ${LOGIN_RATE_LIMIT:-10}
      REGISTER_RATE_LIMIT: ${REGISTER_RATE_LIMIT:-5}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Shown read-only to administrators; the worker uses them.
      CRAWL_CONCURRENCY: ${CRAWL_CONCURRENCY:-16}
      CRAWL_HOST_INTERVAL: ${CRAWL_HOST_INTERVAL:-1s}
      CRAWL_VENDOR_CONCURRENCY: ${CRAWL_VENDOR_CONCURRENCY:-4}
      CRAWL_USER_AGENT_URL: ${CRAWL_USER_AGENT_URL:-https://github.com/0furkancolak/rolescout}
      CRAWL_ALLOW_PRIVATE: ${CRAWL_ALLOW_PRIVATE:-false}
      DISCOVERY_INTERVAL: ${DISCOVERY_INTERVAL:-168h}
      COMPANY_SYNC_INTERVAL: ${COMPANY_SYNC_INTERVAL:-12h}
      RESEARCH_INTERVAL: ${RESEARCH_INTERVAL:-12h}
      JSONLD_MAX_PAGES: ${JSONLD_MAX_PAGES:-200}
      MATCH_MIN_SCORE: ${MATCH_MIN_SCORE:-40}
      LLM_ENABLED: ${LLM_ENABLED:-false}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      LLM_MODEL: ${LLM_MODEL:-qwen3:4b-instruct-2507-q4_K_M}
      LLM_FALLBACK_MODEL: ${LLM_FALLBACK_MODEL-qwen3:1.7b-q4_K_M}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-60s}
      LLM_CONCURRENCY: ${LLM_CONCURRENCY:-1}
      LLM_BATCH: ${LLM_BATCH:-25}
      LLM_MAX_INPUT_CHARS: ${LLM_MAX_INPUT_CHARS:-6000}
      LLM_MAX_OUTPUT_TOKENS: ${LLM_MAX_OUTPUT_TOKENS:-400}
      CLOSED_JOB_RETENTION: ${CLOSED_JOB_RETENTION:-2160h}
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8080}:8080"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/readyz"]
      interval: 10s
      timeout: 3s
      retries: 5

  worker:
    build:
      context: ./api
      args:
        APP: worker
        VERSION: ${ROLESCOUT_VERSION:-dev}
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER:-rolescout}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-rolescout}?sslmode=disable"
      WORKER_TICK: ${WORKER_TICK:-1m}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CRAWL_CONCURRENCY: ${CRAWL_CONCURRENCY:-16}
      CRAWL_HOST_INTERVAL: ${CRAWL_HOST_INTERVAL:-1s}
      CRAWL_VENDOR_CONCURRENCY: ${CRAWL_VENDOR_CONCURRENCY:-4}
      CRAWL_USER_AGENT_URL: ${CRAWL_USER_AGENT_URL:-https://github.com/0furkancolak/rolescout}
      CRAWL_ALLOW_PRIVATE: ${CRAWL_ALLOW_PRIVATE:-false}
      DISCOVERY_INTERVAL: ${DISCOVERY_INTERVAL:-168h}
      COMPANY_SYNC_INTERVAL: ${COMPANY_SYNC_INTERVAL:-12h}
      RESEARCH_INTERVAL: ${RESEARCH_INTERVAL:-12h}
      JSONLD_MAX_PAGES: ${JSONLD_MAX_PAGES:-200}
      MATCH_MIN_SCORE: ${MATCH_MIN_SCORE:-40}
      LLM_ENABLED: ${LLM_ENABLED:-false}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      LLM_MODEL: ${LLM_MODEL:-qwen3:4b-instruct-2507-q4_K_M}
      LLM_FALLBACK_MODEL: ${LLM_FALLBACK_MODEL-qwen3:1.7b-q4_K_M}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-60s}
      LLM_CONCURRENCY: ${LLM_CONCURRENCY:-1}
      LLM_BATCH: ${LLM_BATCH:-25}
      LLM_MAX_INPUT_CHARS: ${LLM_MAX_INPUT_CHARS:-6000}
      LLM_MAX_OUTPUT_TOKENS: ${LLM_MAX_OUTPUT_TOKENS:-400}
      CLOSED_JOB_RETENTION: ${CLOSED_JOB_RETENTION:-2160h}
    # Lets the worker reach a model server (Ollama) running on the host.
    extra_hosts: ["host.docker.internal:host-gateway"]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # The API applies migrations on startup; wait until it is ready.
    depends_on:
      api:
        condition: service_healthy

  # Source management CLI: docker compose run --rm admin sources list
  admin:
    build:
      context: ./api
      args:
        APP: admin
        VERSION: ${ROLESCOUT_VERSION:-dev}
    profiles: ["tools"]
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER:-rolescout}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-rolescout}?sslmode=disable"
    depends_on:
      api:
        condition: service_healthy

  web:
    build:
      context: ./web
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-4173}:8080"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on:
      api:
        condition: service_healthy

volumes:
  rolescout_postgres_data:
